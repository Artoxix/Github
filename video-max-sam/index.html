<!doctype html>
<html lang="fr" data-resolution="portrait">

      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36.2" data-width="1080" data-height="1920">
      <!-- le décor, Max et Sam, les accessoires et les cartes du script -->
