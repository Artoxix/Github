          [q(W('m3', 'du') - 0.05), { L: [122, 26], R: [8, 0] }, 0.25],
          [q(W('m3', 'tapent') + 0.15), { L: [30, 60], R: [8, 0] }, 0.3],

          [q(W('m4', 'premier')), { L: [30, 56], R: [30, 56] }, 0.3],
          [q(LINE.m4.end), REST, 0.3],
          [q(LINE.m5.start), { L: [8, 0], R: [36, 62] }, 0.3],
          [q(W('m5', 'audit') - 0.05), { L: [132, 18], R: [36, 62] }, 0.25],
          [q(W('m5', 'sans')), { L: [8, 0], R: [42, 112] }, 0.25],
          [q(W('m5', 'lien') - 0.05), { L: [8, 0], R: [150, 24] }, 0.2],
          [q(W('m5', 'lien') + 0.25), { L: [8, 0], R: [150, -6] }, 0.17],
          [q(W('m5', 'lien') + 0.5), { L: [8, 0], R: [150, 24] }, 0.17],
          [q(W('m5', 'lien') + 0.75), { L: [8, 0], R: [150, -6] }, 0.17],
          [q(W('m5', 'lien') + 1.0), { L: [8, 0], R: [150, 24] }, 0.17],
        ],
        mood: [[0, 'listen'], [q(W('s1', 'la')), 'perplexed'], [q(LINE.m1.start), 'confident'], [q(W('m1', 'je')), 'happy'],
          [q(LINE.m2.start), 'serious'], [q(LINE.m2.end + 0.2), 'listen'], [q(LINE.m3.start), 'happy'],
          [q(W('m3', 'tes')), 'joy'], [q(W('m3', 'ta')), 'happy'], [q(LINE.m4.start), 'confident'], [q(W('m4', 'dappels')), 'happy'],
          [q(W('m4', 'pas')), 'serious'], [q(W('m4', 'eviter') + 0.3), 'confident'], [q(LINE.m5.start), 'happy'],
          [q(W('m5', 'bidon') - 0.15), 'wink'], [q(W('m5', 'lien')), 'happy']],
        head: [[0, -4], [q(W('s1', 'la')), -8, 0.2], [q(LINE.m1.start), 0],
          [q(W('m2', 'personne', 1)), -6, 0.1], [q(W('m2', 'personne', 1) + 0.17), 6, 0.12], [q(W('m2', 'personne', 1) + 0.34), -6, 0.12],
          [q(W('m2', 'personne', 1) + 0.51), 5, 0.12], [q(W('m2', 'personne', 1) + 0.68), 0, 0.15],
          [q(LINE.m2.end + 0.2), -4], [q(LINE.m3.start), 0],
          [q(W('m4', 'promesse')), -5, 0.1], [q(W('m4', 'promesse') + 0.17), 5, 0.12], [q(W('m4', 'promesse') + 0.34), -5, 0.12], [q(W('m4', 'promesse') + 0.51), 0, 0.15],
          [q(W('m5', 'bidon') - 0.15), 7, 0.15], [q(W('m5', 'lien')), 0, 0.2]],
        lean: [[0, 0], [q(W('m1', 'fuis') - 0.17), 3, 0.2], [q(W('m1', 'je')), 0, 0.4]],
        hop: [[q(W('m4', 'dappels')), -8, 0.1], [q(W('m4', 'dappels') + 0.17), 0, 0.2]],
        look: [[0, [-5, 0]], [q(LINE.m1.start), [0, 0]], [q(W('m2', 'lalgorithme') - 0.2), [-4, -5]], [q(W('m2', 'personne', 1)), [0, 0]],
          [q(LINE.s2.start - 0.2), [-5, 0]], [q(LINE.m3.start), [0, 0]],
          [q(W('m3', 'un')), [-4, -4]], [q(W('m3', 'propre') + 0.2), [0, 0]], [q(W('m3', 'du')), [-4, -4]], [q(W('m3', 'tapent') + 0.2), [0, 0]],
          [q(W('m3', 'et')), [-4, -4]], [q(W('m3', 'tes')), [0, 0]], [q(LINE.s3.start - 0.2), [-5, 0]],
          [q(LINE.m4.start), [-3, -4]], [q(W('m4', 'plus', 1)), [0, 0]], [q(W('m4', 'pas')), [-5, 2]],
          [q(W('m4', 'trop')), [-4, 4]], [q(W('m4', 'premier')), [0, 0]], [q(W('m5', 'audit')), [-4, -4]], [q(W('m5', 'sans')), [0, 0]]],
      };
      const RIG = { sam: SAM, max: MAX };

      function blinkAt(who, f) {          // clignements : 2 images toutes les 2,5 à 4,2 s
        const r = Rig.prng(who === 'max' ? 101 : 202);
        let t = 0.8 + r() * 1.5;
        while (t * FPS < f + 3) {
          const b = Math.round(t * FPS);
          if (f === b || f === b + 1) return true;
          t += 2.5 + r() * 1.7;
        }
        return false;
      }

      function poseChar(who, t, f) {
        const k = RIG[who];
        const r = Rig.prng(f * 31 + (who === 'max' ? 7 : 3));
        const j = (a) => (r() * 2 - 1) * a;
        const talk = +(T.mouth[who][f] || 0);
        const arm = Rig.track(k.arm, t, REST);
        Rig.apply(H[who], {
          arm: { L: [arm.L[0] + j(0.7), arm.L[1] + j(0.7)], R: [arm.R[0] + j(0.7), arm.R[1] + j(0.7)] },
          head: Rig.track(k.head, t, 0) + j(0.6) + (talk ? j(1.2) : 0),
          headDy: talk >= 2 ? -1.5 : 0,
          lean: Rig.track(k.lean, t, 0) + j(0.3),
          dx: j(0.7),
          dy: Rig.track(k.hop || [], t, 0) + j(0.4),
          squash: 1 + 0.008 * Math.sin((t * 2 * Math.PI) / 2.6),
          mood: Rig.step(k.mood, t, 'neutral'),
          talk,
          blink: blinkAt(who, f),
          look: Rig.track(k.look, t, [0, 0]),
        });
      }

      // contrat → boule froissée → main vide
      const tCrumple = q(W('m4', 'magique') + 0.12);
      const tThrow = 25.4167;
      function props(t) {
        H.sam.contract.setAttribute('opacity', t < tCrumple ? 1 : 0);
        H.sam.ball.setAttribute('opacity', t >= tCrumple && t < tThrow ? 1 : 0);
      }

      // ------------------------------------------------------------ minutage des pièces (12 i/s)
      const inner = gsap.timeline({ paused: true });
      const SHOTS = {
        wide: { x: 540 - 540 * 1.12, y: 1290 - 1200 * 1.12, scale: 1.12 },
        maxCU: { x: 540 - 810 * 1.9, y: 900 - 661 * 1.9, scale: 1.9 },
        samCU: { x: 540 - 270 * 1.9, y: 900 - 661 * 1.9, scale: 1.9 },
        maxMeth: { x: 600 - 810 * 1.7, y: 1040 - 661 * 1.7, scale: 1.7 },
        twoMed: { x: 540 - 540 * 1.32, y: 1000 - 700 * 1.32, scale: 1.32 },
      };
      const CUTS = [[0, 'wide'], [3.1667, 'maxCU'], [5.5, 'wide'], [10.1667, 'samCU'], [12.4167, 'maxMeth'],
        [19.75, 'samCU'], [21.5833, 'twoMed'], [25.8333, 'wide'], [29.1667, 'maxCU']];
      gsap.set('#st-cam', { ...SHOTS.wide, transformOrigin: '0 0' });   // cadrage de la 1re image
      CUTS.forEach(([t, s]) => inner.set('#st-cam', { ...SHOTS[s], transformOrigin: '0 0' }, t));

      const land = (sel, t, rot = 0, from = {}) => inner.fromTo(sel,
        { y: -46, rotation: rot - 7, opacity: 0, scale: 1.04, ...from },
        { y: 0, rotation: rot, opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, t);
      const lift = (sel, t) => inner.to(sel, { y: -30, rotation: '+=5', opacity: 0, duration: 0.17, ease: 'power2.in' }, t);

      // accroche : déjà posée à l'image 0, petit coup de tampon
      inner.fromTo('#st-hook-in', { rotation: -2, scale: 1 }, { rotation: -1, scale: 1.03, duration: 0.09, ease: 'none' }, 0.17);
      inner.to('#st-hook-in', { rotation: -2, scale: 1, duration: 0.17, ease: 'none' }, 0.26);
      ['#st-sp1', '#st-sp2', '#st-sp3'].forEach((s, i) => {
        inner.fromTo(s, { scale: 0.5, rotation: 0 }, { scale: 1.15, rotation: 45, duration: 0.5, ease: 'steps(3)', repeat: 4, yoyo: true }, i * 0.17);
      });
      land('#st-fuis-in', 3.75, 6, { scale: 1.6, y: 0 });
      // coffre : tombe du ciel, rebondit au bout du fil, se balance ; le cadenas tremble sur « garantir »
      inner.fromTo('#st-safe-in', { y: -760, rotation: 0 }, { y: 0, duration: 0.25, ease: 'power2.in' }, 5.6667);
      inner.to('#st-safe-in', { y: -26, duration: 0.1666, ease: 'power2.out' }, 5.9167);
      inner.to('#st-safe-in', { y: 0, duration: 0.17, ease: 'power2.in' }, 6.0833);
      inner.fromTo('#st-safe-in', { rotation: 0 }, { rotation: 2.4, duration: 0.75, ease: 'sine.inOut', yoyo: true, repeat: 4, immediateRender: false }, 6.25);
      inner.fromTo('#st-lock', { rotation: 0, svgOrigin: '151 100' }, { rotation: 14, duration: 0.09, ease: 'none', yoyo: true, repeat: 5 }, q(W('m2', 'garantir')));
      inner.fromTo('#st-dial', { rotation: 0, svgOrigin: '95 98' }, { rotation: 360, duration: 1.4, ease: 'steps(8)' }, q(W('m2', 'lalgorithme')));
      land('#st-algo-in', 5.5833, -1.5);
      land('#st-q1a', 10.5, 8);
      land('#st-q1b', 11.6667, -10);
      land('#st-q2a', q(W('s3', 'quoi')), 10);
      // méthode : titre puis 3 cartes posées une à une
      land('#st-meth-t', q(W('m3', 'methode') - 0.08), -1);
      land('#st-c1', q(W('m3', 'un') - 0.05), -1.5);
      inner.fromTo('#st-c1-bar', { scaleX: 0 }, { scaleX: 0.98, duration: 0.67, ease: 'steps(6)' }, q(W('m3', 'techniquement')));
      land('#st-c2', q(W('m3', 'du') - 0.05), 1);
      const qtext = 'boulangerie près de moi';
      const qel = document.querySelector('#st-c2-q');
      const typing = { n: 0 };
      inner.fromTo(typing, { n: 0 }, { n: qtext.length, duration: 1.2, ease: 'none',
        onUpdate: () => { qel.textContent = qtext.slice(0, Math.round(typing.n)) || ' '; } }, q(W('m3', 'contenu')));
      land('#st-c3', q(W('m3', 'et') - 0.05), -1);

      land('#st-r1', q(W('m4', 'trafic') - 0.1), -1.5);

      // la boule part de la main de Sam et sort du cadre
      const [hx, hy] = Rig.hand('R', 168, 30);
      const bx = POS.sam[0] + hx * K - 48, by = POS.sam[1] + (hy - 10) * K - 48;
      inner.fromTo('#st-ball-in', { x: bx, y: by, rotation: 0 }, { x: bx + 330, y: by - 260, rotation: 260, duration: 0.25, ease: 'none' }, tThrow);
      inner.to('#st-ball-in', { x: bx + 720, y: by - 380, rotation: 520, duration: 0.17, ease: 'power1.in' }, tThrow + 0.25);
      // drapeau rouge : tombe et se plante, oscille
      inner.fromTo('#st-flag-in', { y: -900, rotation: -6 }, { y: 0, rotation: -6, duration: 0.17, ease: 'power2.in' }, q(W('m4', 'promesse', 1) - 0.08));

      land('#st-red-in', 26.3333, -1.5);
      // appel à l'action
      land('#st-cta-in', q(W('m5', 'audit') - 0.1), -1.5);
      land('#st-cta-stamp', q(W('m5', 'sans')), -7, { scale: 1.8, y: 0 });
      land('#st-cta-bio', q(W('m5', 'bidon')), 0);

      // ------------------------------------------------------------ rendu image par image
      const pieces = Array.from(document.querySelectorAll('#root .pp'));
      function render(time) {
        const f = Math.floor(time * FPS + 1e-4);
        const t = f / FPS;
        inner.seek(t, false);
        poseChar('sam', t, f);
        poseChar('max', t, f);
        props(t);
        const r = Rig.prng(f * 13 + 5);
        pieces.forEach((el) => {
          el.style.translate = `${((r() * 2 - 1) * 1.2).toFixed(2)}px ${((r() * 2 - 1) * 1.2).toFixed(2)}px`;
          el.style.rotate = `${((r() * 2 - 1) * 0.25).toFixed(3)}deg`;
        });
        $('#st-flicker').style.opacity = (0.015 + r() * 0.02).toFixed(3);
      }
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: D, duration: D, ease: 'none', onUpdate: () => render(tl.time()) }, 0);
      render(0);
      window.__timelines['stage'] = tl;
    })();
