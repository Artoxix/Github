<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../video/fonts/poppins.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1800px;font-family:Poppins,sans-serif;color:#0E1A4F;background:linear-gradient(180deg,#F4F6FD,#ECEFFC)}
h1{font-size:54px;font-weight:800;text-align:center;padding:50px 0 6px;letter-spacing:-1px}
h1 span{background:linear-gradient(120deg,#4F7FE8,#A05BDC);-webkit-background-clip:text;color:transparent}
.intro{text-align:center;font-size:24px;color:#66709A;margin-bottom:20px}
h2{font-size:38px;font-weight:700;padding:30px 70px 0}
h2 small{font-size:22px;font-weight:500;color:#66709A;margin-left:12px}
.row{display:flex;justify-content:space-around;padding:10px 40px 30px}
.cell{width:540px;text-align:center}
.stage{height:930px;display:flex;align-items:flex-end;justify-content:center;background:#fff;border-radius:40px;box-shadow:0 20px 50px rgba(28,38,110,.10);padding-bottom:20px;position:relative}
.tag{position:absolute;top:22px;left:22px;font-weight:800;font-size:30px;color:#fff;background:linear-gradient(120deg,#4F7FE8,#A05BDC);border-radius:20px;padding:4px 18px}
.lbl{font-weight:700;font-size:28px;margin-top:16px}
.desc{font-size:21px;color:#66709A;line-height:1.35;margin-top:4px;padding:0 20px}
</style></head><body>
<h1>Personnages · <span>3 propositions chacun</span></h1>
<div class="intro">Style 3D « jouet », dessinés en vectoriel et découpés pour l'animation (bouche, yeux, bras, tête)</div>
<h2>Personnage 1 <small>cheveux bouclés brun foncé · prénom à choisir</small></h2>
<div class="row" id="r1"></div>
<h2>Maxence <small>cheveux brun clair, entre lisses et légèrement ondulés</small></h2>
<div class="row" id="r2"></div>
<script src="characters.js"></script>
<script>
const R1=[
 {id:'A1',lbl:'Le pro en costume',desc:'Boucles courtes, costume bleu marine, chemise blanche, comme ton modèle',
  o:{hair:'curly-tight',hairColor:'darkBrown',pose:'thumb',outfit:{type:'suit',top:'#2F3F73',pants:'#2F3F73',shoes:'#1A1A22'}}},
 {id:'A2',lbl:'Le garagiste',desc:'Boucles en volume, barbe de 3 jours, combinaison de mécano, clé à la main',
  o:{hair:'curly-volume',hairColor:'darkBrown',stubble:true,pose:'point',outfit:{type:'overall',top:'#1F4E8C',pants:'#1F4E8C',shoes:'#2A2A30',patch:'GARAGE',prop:WRENCH}}},
 {id:'A3',lbl:'Le décontracté',desc:'Boucles et côtés dégradés, sweat à capuche, jean, baskets blanches',
  o:{hair:'curly-fade',hairColor:'darkBrown',pose:'wave',outfit:{type:'hoodie',top:'#2E8B6E',pants:'#3B5A8C',shoes:'#F4F5FA',shoeType:'sneaker'}}},
];
const R2=[
 {id:'B1',lbl:'Le consultant',desc:'Mèche ondulée sur le côté, costume gris-bleu, cravate aux couleurs Seomastertech',
  o:{hair:'wavy-side',hairColor:'lightBrown',pose:'thumb',outfit:{type:'suit',top:'#56688F',pants:'#56688F',shoes:'#1A1A22',shirt:'#EAF2FF',tie:'#6F6FE8'}}},
 {id:'B2',lbl:'L\'expert Seomastertech',desc:'Raie au milieu légèrement ondulée, polo de la marque avec le logo, chino',
  o:{hair:'wavy-middle',hairColor:'lightBrown',pose:'wave',outfit:{type:'polo',top:'#4F7FE8',pants:'#C9B48F',shoes:'#F4F5FA',shoeType:'sneaker',chestLogo:MINI_LOGO}}},
 {id:'B3',lbl:'Le startupeur',desc:'Cheveux coiffés vers l\'arrière, lunettes, blazer ouvert, t-shirt blanc, jean',
  o:{hair:'wavy-quiff',hairColor:'lightBrown',glasses:true,pose:'point',outfit:{type:'blazer',top:'#24305E',pants:'#3B5A8C',shoes:'#F4F5FA',shoeType:'sneaker',tee:'#FFFFFF',teeLogo:MINI_LOGO}}},
];
for(const [rid,list] of [['r1',R1],['r2',R2]]) for(const c of list){
  document.getElementById(rid).insertAdjacentHTML('beforeend',`<div class="cell"><div class="stage"><div class="tag">${c.id}</div>${character({...c.o,w:380})}</div><div class="lbl">${c.id} · ${c.lbl}</div><div class="desc">${c.desc}</div></div>`);
}
document.fonts.ready.then(()=>{window.READY=true});
</script></body></html>
